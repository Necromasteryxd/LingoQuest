<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LingoQuest</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg1:#fdf2fb;--bg2:#e9f3ff;--text:#2e2c52;--muted:#7b7a9c;--g1:rgba(255,255,255,.72);--g2:rgba(255,255,255,.32);--gb:rgba(255,255,255,.9);--hi:#fff;--sh:rgba(140,125,200,.2);--a:#7ba3ff;--b:#b794f6;--ok:#2f9e6b;--bad:#d6537a;--b1:#ffd3e6;--b2:#d3e3ff;--b3:#d0f4e3;--bo:.9;color-scheme:light;
--f:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--h:"Unbounded","Manrope",system-ui,sans-serif}
:root[data-theme="dark"]{--bg1:#16161f;--bg2:#1a1a24;--text:#e8e8f0;--muted:#9898a8;--g1:rgba(255,255,255,.08);--g2:rgba(255,255,255,.03);--gb:rgba(255,255,255,.1);--hi:rgba(255,255,255,.06);--sh:rgba(0,0,0,.35);--ok:#4caf82;--bad:#d66b84;--b1:#2a2a36;--b2:#262632;--b3:#22222c;--bo:.12;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:auto;-webkit-overflow-scrolling:touch;transition:background-color .55s ease,color .45s ease}
body{overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;margin:0;font-family:var(--f);color:var(--text);min-height:100vh;min-height:100dvh;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:background .55s ease,color .45s ease}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:var(--bo);z-index:0;pointer-events:none;animation:none;transition:opacity .6s}
.blob:nth-child(1){width:320px;height:320px;background:var(--b1);top:-70px;left:-90px}
.blob:nth-child(2){width:340px;height:340px;background:var(--b2);top:38%;right:-130px;animation-duration:25s}
.blob:nth-child(3){width:300px;height:300px;background:var(--b3);bottom:-90px;left:8%;animation-duration:29s}
@keyframes drift{to{transform:translate(60px,70px) scale(1.2)}}
#app{position:relative;z-index:2;max-width:520px;margin:0 auto;padding:16px 16px 110px;text-align:center;overflow:visible}
.glass{position:relative;background:linear-gradient(135deg,var(--g1),var(--g2));-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--gb);border-radius:28px;box-shadow:inset 0 1.5px 0 var(--hi),0 10px 32px var(--sh);transition:transform .35s cubic-bezier(.2,.9,.3,1),box-shadow .35s,background .5s,border-color .4s}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 60% at 20% 0%,var(--hi),transparent 55%);opacity:.3;pointer-events:none}

#app .tok{animation:pop .3s both}#app .opt.bad{animation:shake .4s}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:20px}
.hd>:first-child{justify-self:start}.hd>:last-child{justify-self:end}
.sub{color:var(--muted);font-weight:600;font-size:14px}
h1{font-family:var(--h);font-weight:500;font-size:22px;margin:2px 0 0;letter-spacing:-.3px}
h3{font-family:var(--h);font-weight:500;font-size:14px;margin:26px 0 14px;color:var(--text)}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:20px;font:800 14px var(--f);color:var(--text);border:1px solid var(--gb);cursor:pointer;min-width:44px}
button.pill:active{transform:scale(.9) rotate(15deg)}
.goal{padding:22px;display:flex;flex-direction:column;align-items:center;gap:6px}
.ring{width:112px;height:112px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .t{stroke:var(--g1)}.ring .p{stroke:url(#gr);transition:stroke-dashoffset 1.4s cubic-bezier(.2,.9,.3,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:500 22px var(--h)}
.goal h2{margin:6px 0 0;font-size:18px;font-weight:800}.goal p{margin:0;color:var(--muted);font-weight:600;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 12px;cursor:pointer}
.tp:hover{transform:translateY(-4px)}.tp:active{transform:scale(.95)}
.mono{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;color:#fff;font:500 17px var(--h);text-shadow:0 1px 3px rgba(60,40,120,.3);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),0 6px 16px var(--sh);margin-bottom:6px;transition:transform .4s}
.tp:hover .mono{transform:scale(1.1) rotate(-6deg)}
.tp b{font-size:16px;font-weight:800}.tp small{color:var(--muted);font-weight:600;font-size:12.5px}
.mini{width:100%;height:5px;border-radius:5px;background:var(--g1);margin-top:8px;overflow:hidden}.mini i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--a),var(--b));transition:width 1.2s cubic-bezier(.2,.9,.3,1)}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:22px;padding:16px;font:800 16px var(--f);color:#fff;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),0 10px 26px rgba(140,130,240,.4);cursor:pointer;margin-top:12px;transition:transform .25s cubic-bezier(.2,.9,.3,1),opacity .3s}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:sweep 4s infinite}
@keyframes sweep{60%,100%{left:130%}}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.96)}.btn:disabled{opacity:.4}
.btn.g{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--text);border:1px solid var(--gb);box-shadow:inset 0 1.5px 0 var(--hi),0 6px 20px var(--sh);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.btn.g::after{display:none}.row{display:flex;gap:12px}
.tabs{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(94%,400px);display:flex;padding:6px;border-radius:34px;z-index:50;
  transform:translate3d(-50%,0,0);will-change:transform;
  transition:transform .55s cubic-bezier(.33,1,.22,1),opacity .5s cubic-bezier(.33,1,.22,1);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.tabs.hide,.tabs.down{transform:translate3d(-50%,120%,0);opacity:0;pointer-events:none}

.tabs button{flex:1;border:0;background:none;color:var(--muted);font:700 10px var(--f);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;border-radius:26px;cursor:pointer;transition:all .4s cubic-bezier(.2,.9,.3,1);position:relative;z-index:1}
.tabs button.on{color:var(--text);background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:inset 0 1px 0 var(--hi),0 4px 14px var(--sh);transform:translateY(-2px)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:0;color:var(--text);cursor:pointer;padding:0;flex:none}
.x:active{transform:scale(.88) rotate(90deg)}
.bar{flex:1;height:10px;border-radius:10px;background:var(--g1);overflow:hidden;box-shadow:inset 0 1px 2px var(--sh)}
.bar i{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,var(--a),var(--b));transition:width .7s cubic-bezier(.2,.9,.3,1)}
.hr{display:flex;align-items:center;gap:5px;font-weight:800;color:var(--bad)}
.lab{color:var(--muted);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:1.6px}
.word{font:500 32px var(--h);margin:12px 0 28px;word-break:break-word;line-height:1.25}
.opt{display:block;width:100%;text-align:center;padding:17px 20px;margin-bottom:11px;font:700 17px var(--f);color:var(--text);cursor:pointer;border-radius:22px}
.opt:hover{transform:translateY(-2px)}.opt:active{transform:scale(.97)}
.opt.good{box-shadow:inset 0 0 0 2px var(--ok),0 10px 30px var(--sh)}.opt.bad{box-shadow:inset 0 0 0 2px var(--bad)}
.play{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;border:0;color:var(--text);cursor:pointer;margin:10px auto 30px;animation:pulse 2.6s ease-in-out infinite}
.play .ic{width:36px;height:36px}
@keyframes pulse{50%{transform:scale(1.07)}}
.field{width:100%;padding:17px 20px;font:700 20px var(--f);color:var(--text);text-align:center;border-radius:22px;outline:0}
.field:focus{box-shadow:0 0 0 3px var(--a)}
.line{min-height:66px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;justify-content:center;border-radius:22px}
.bank{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:24px}
.tok{padding:11px 16px;border-radius:16px;font:700 16px var(--f);color:var(--text);cursor:pointer}
.tok:active{transform:scale(.9)}.tok.used{opacity:.2;pointer-events:none}
.fb{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:496px;margin:0 auto;padding:20px;text-align:center;transform:translateY(140%);transition:transform .55s cubic-bezier(.2,1.1,.3,1);z-index:30}
.fb.show{transform:none}.fb b{font:500 18px var(--h);display:block;margin-bottom:6px}
.fb.good b{color:var(--ok)}.fb.bad b{color:var(--bad)}.fb p{margin:0;font-weight:600}
.c3{perspective:1000px;height:270px;margin:6px 0 8px;cursor:pointer}
.fl{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.3,1.2,.4,1);transform-style:preserve-3d}
.c3.on .fl{transform:rotateY(180deg)}
.fc{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;font:500 30px var(--h);padding:16px;border-radius:32px;animation:none!important}
.fc.bk{transform:rotateY(180deg)}.fc small{font:700 12px var(--f);color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:16px}
.res{padding-top:16px}.res h2{font:500 24px var(--h);margin:14px 0 6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:22px 0 8px}.stats.two{grid-template-columns:1fr 1fr}
.stats div{padding:18px 6px;font:500 22px var(--h)}
.stats small{display:block;font:700 11px var(--f);color:var(--muted);margin-top:7px;text-transform:uppercase;letter-spacing:1px}
.pr{padding:24px}.pr .mono{width:80px;height:80px;border-radius:50%;margin:0 auto 12px;font-size:30px;background:linear-gradient(135deg,var(--a),var(--b))}
.lvbar{height:8px;border-radius:8px;background:var(--g1);margin:14px 0 8px;overflow:hidden}.lvbar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:8px;transition:width 1.3s cubic-bezier(.2,.9,.3,1)}
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.chip{padding:10px 14px;border-radius:18px;font:700 13px var(--f);display:flex;gap:6px;align-items:center;opacity:.45}.chip.on{opacity:1;color:var(--ok)}
.md{padding:20px;margin-bottom:12px;cursor:pointer}.md:hover{transform:translateY(-3px)}.md:active{transform:scale(.97)}
.md b{font:500 17px var(--h);display:block;margin-bottom:6px}
.md small{color:var(--muted);font-weight:600;display:block;font-size:13px}.md em{font:800 13px var(--f);font-style:normal;color:var(--a);display:block;margin-top:10px}
.cd{font:500 120px var(--h);margin-top:28vh;animation:pop .7s both}
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font:800 15px var(--f)}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:8px 0 20px}
.pod>div{flex:1;padding:14px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.9,.3,1) both}
.pod .mono{width:44px;height:44px;border-radius:50%;margin:0}.pod b{font-size:13px}.pod small{color:var(--muted);font-weight:700;font-size:12px}
.pod .n{font:500 20px var(--h)}
.lr{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:10px;border-radius:22px;text-align:left}
.lr .mono{width:38px;height:38px;border-radius:50%;margin:0;font-size:13px}.lr b{flex:1;font-weight:800}.lr span{font-weight:800;color:var(--muted)}
.lr.me{box-shadow:inset 0 0 0 2px var(--a),0 10px 30px var(--sh)}.lr>i{font:500 14px var(--h);font-style:normal;width:22px;color:var(--muted)}
@keyframes fo{to{transform:translate3d(calc(var(--d)*-28px),8px,0);opacity:0}}
@keyframes fi{from{transform:translate3d(calc(var(--d)*28px),8px,0);opacity:0}to{transform:none;opacity:1}}
#app.fo{animation:fo .22s cubic-bezier(.4,0,.2,1) both}
#app.fi{animation:fi .36s cubic-bezier(.22,1,.36,1) both}
.mas{display:block;margin:0 auto;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 10px 20px rgba(80,60,140,.26));cursor:pointer;overflow:visible;transform-origin:center bottom;transition:filter .3s}
.mas .ey{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.mas .m2{display:none}.mas.sad .m1{display:none}.mas.sad .m2{display:inline}
.mas.jump{animation:jump .75s cubic-bezier(.3,1.4,.5,1)}
.mas.wave{animation:wave .9s cubic-bezier(.22,1,.36,1)}
.mas.happy{animation:happy 1s cubic-bezier(.22,1,.36,1)}
.mas.sad{animation:sadbob .8s ease}
.mas-wrap{cursor:pointer;display:flex;flex-direction:column;align-items:center}
@keyframes blink{0%,42%,48%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-6px) rotate(-2deg)}50%{transform:translateY(-10px) rotate(0)}75%{transform:translateY(-6px) rotate(2deg)}}
@keyframes jump{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-28px) scale(1.06)}50%{transform:translateY(-22px) scale(1.02)}70%{transform:translateY(-4px) scale(.98)}100%{transform:translateY(0) scale(1)}}
@keyframes wave{0%{transform:rotate(0)}20%{transform:rotate(-12deg) translateY(-4px)}40%{transform:rotate(10deg) translateY(-6px)}60%{transform:rotate(-8deg) translateY(-3px)}80%{transform:rotate(6deg)}100%{transform:rotate(0)}}
@keyframes happy{0%{transform:scale(1)}25%{transform:scale(1.12) translateY(-8px)}50%{transform:scale(1.05) translateY(-4px) rotate(-4deg)}75%{transform:scale(1.08) translateY(-6px) rotate(4deg)}100%{transform:scale(1)}}
@keyframes sadbob{0%{transform:translateY(0)}40%{transform:translateY(6px) scale(.96)}100%{transform:translateY(0)}}

.set-row{flex-wrap:wrap}
.md{padding:16px;cursor:pointer;transition:transform .25s}
.md:active{transform:scale(.97)}
.md b{display:block;font-size:16px;margin-bottom:4px}
.md small{display:block;color:var(--muted);font-weight:600;font-size:12.5px;margin-top:2px}
.md em{display:block;margin-top:8px;font-style:normal;font-weight:800;font-size:13px;color:var(--a)}

@keyframes pulse{0%,100%{box-shadow:0 4px 14px var(--sh),0 0 0 0 rgba(107,150,255,.4)}50%{box-shadow:0 4px 18px var(--sh),0 0 0 8px rgba(107,150,255,0)}}
.daily-card{display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:flex-start!important;gap:14px;padding:15px 16px;margin:12px 0 16px;width:100%;box-sizing:border-box;text-align:left!important;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .35s ease,opacity .3s}
.daily-card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.12) 50%,transparent 60%);
  transform:translateX(-120%);opacity:0}
.daily-card:not(.done):hover::after,.daily-card:not(.done).shine::after{animation:dshine 1.4s ease}
@keyframes dshine{0%{transform:translateX(-120%);opacity:0}30%{opacity:1}100%{transform:translateX(120%);opacity:0}}
.daily-card .ico{width:46px;height:46px;min-width:46px;border-radius:14px;
  background:#e86b4a;
  display:flex!important;align-items:center;justify-content:center;font-size:0;line-height:1;flex-shrink:0;
  box-shadow:0 3px 10px rgba(200,80,50,.25);position:relative;z-index:1;
  transition:transform .4s cubic-bezier(.22,1,.36,1),background .35s}
.daily-card:not(.done) .ico{animation:dico 2.8s ease-in-out infinite}
@keyframes dico{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.daily-card .ico svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.daily-card .daily-txt{flex:1;min-width:0;text-align:left!important;display:flex;flex-direction:column;justify-content:center;gap:3px;position:relative;z-index:1}
.daily-card .daily-txt b{font-size:15px;font-weight:800;line-height:1.25;display:block;text-align:left!important;margin:0}
.daily-card .daily-txt small{color:var(--muted);font-weight:600;font-size:12px;line-height:1.3;display:block;text-align:left!important;margin:0}
.daily-card.done{opacity:.8}
.daily-card.done .ico{background:#3d9a6a;animation:none;box-shadow:0 2px 8px rgba(40,120,80,.2)}
.daily-card:active{transform:scale(.985)}
.daily-card:not(.done):hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 var(--hi),0 12px 28px rgba(80,60,140,.14)}

/* Mobile & quality polish */
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;-webkit-tap-highlight-color:transparent;-webkit-overflow-scrolling:touch}
body.noscroll{overflow-y:auto}
body:not(.noscroll){overscroll-behavior-y:contain}
html,body{overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;overscroll-behavior-y:none}
#app>*:last-child{margin-bottom:0}
#app{padding:14px 14px 100px;max-width:520px}
@media(max-width:400px){
  #app{padding:12px 12px 96px}
  .tp{padding:14px 10px}
  .mono{width:46px;height:46px;font-size:15px;border-radius:16px}
  .goal{padding:18px}
  .ring{width:96px;height:96px}
  .btn{padding:14px;font-size:15px;border-radius:18px}
  .tabs{width:min(96%,380px);padding:5px}
  .tabs button{font-size:10px;padding:8px 0}
  h1{font-size:20px}
  .word{font-size:22px}
}
@media(min-width:600px){
  #app{padding:20px 20px 100px}
}
.glass{box-shadow:inset 0 1.5px 0 var(--hi),0 10px 32px rgba(80,60,140,.14),0 3px 10px rgba(40,30,80,.08)}
.opt,.wr,.md,.daily-card,.tp,.tok,.chip,.field,.srch,.play{
  box-shadow:inset 0 1px 0 var(--hi),0 8px 22px rgba(80,60,140,.11),0 2px 6px rgba(40,30,80,.07);
  transition:transform .4s cubic-bezier(.22,1,.36,1),box-shadow .4s cubic-bezier(.22,1,.36,1);
}
.btn{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),0 10px 26px rgba(140,130,240,.38),0 3px 8px rgba(80,60,140,.12);transition:transform .4s cubic-bezier(.22,1,.36,1),box-shadow .4s}
.tabs{box-shadow:0 12px 40px rgba(80,60,140,.18),0 4px 12px rgba(40,30,80,.1)}
.mini{height:7px;border-radius:7px;background:rgba(120,110,180,.18);box-shadow:inset 0 1px 3px rgba(40,30,80,.12)}
.mini i{box-shadow:0 1px 4px rgba(140,120,240,.4);transition:width 1.1s cubic-bezier(.22,1,.36,1)}
.lvbar{height:10px;border-radius:10px;background:rgba(120,110,180,.18);box-shadow:inset 0 1px 3px rgba(40,30,80,.12)}
.lvbar i{box-shadow:0 1px 5px rgba(140,120,240,.45)}
.bar{height:8px;border-radius:8px;background:rgba(120,110,180,.18);box-shadow:inset 0 1px 3px rgba(40,30,80,.12)}
.bar i{box-shadow:0 1px 4px rgba(140,120,240,.4)}
.field,.srch{font-size:16px} /* prevent iOS zoom on focus */
input,button,select{font-family:inherit}
.edit-field{width:100%;box-sizing:border-box;padding:14px 16px;border:0;border-radius:16px;font:600 15px var(--f);color:var(--text);margin:6px 0 12px;outline:none;background:linear-gradient(135deg,var(--g1),var(--g2));border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--hi),0 4px 14px rgba(80,60,140,.1)}
.avatar-pick{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.avatar-pick button{width:52px;height:52px;border-radius:50%;border:2px solid transparent;font-size:24px;cursor:pointer;background:var(--g1);box-shadow:0 4px 14px rgba(80,60,140,.12);transition:transform .3s,border-color .3s}
.avatar-pick button.on{border-color:var(--a);transform:scale(1.08);box-shadow:0 6px 18px rgba(140,120,240,.3)}
.profile-name{font:700 18px var(--h);margin:8px 0 2px}
.profile-bio{color:var(--muted);font-size:13px;font-weight:600}


/* Dictionary design */
.fil{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;justify-content:center}
.fil button{border:0;padding:9px 14px;border-radius:16px;font:700 12.5px var(--f);background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--muted);cursor:pointer;border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--hi),0 4px 12px rgba(80,60,140,.1);transition:transform .3s,box-shadow .3s,color .2s,background .3s}
.fil button.on{color:#fff;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 6px 18px rgba(140,120,240,.35);transform:translateY(-1px)}
.fil button:active{transform:scale(.96)}
.srch{width:100%;box-sizing:border-box;padding:14px 16px;border:0;border-radius:18px;font:600 16px var(--f);color:var(--text);margin:8px 0;outline:none;background:linear-gradient(135deg,var(--g1),var(--g2));border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--hi),0 6px 18px rgba(80,60,140,.1)}
select.srch{appearance:none;-webkit-appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) calc(50% - 3px),calc(100% - 12px) calc(50% - 3px);background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:36px}
.wr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;margin-bottom:10px;text-align:left;cursor:pointer;border-radius:20px}
.wr>div{flex:1;min-width:0}
.wr b{display:block;font-size:15.5px;font-weight:800;color:var(--text);line-height:1.3}
.wr small{display:block;color:var(--muted);font-weight:600;font-size:12.5px;margin-top:3px}
.ib{border:0;background:rgba(120,110,180,.1);cursor:pointer;padding:8px;border-radius:12px;opacity:.55;flex-shrink:0;display:grid;place-items:center;transition:opacity .25s,transform .25s,background .25s}
.ib .ic{width:18px;height:18px}
.ib.on{opacity:1;background:rgba(245,197,66,.25);color:#e6a800}
.ib:active{transform:scale(.9)}
#wl{margin-top:4px;padding-bottom:8px}
#dc{font-weight:700;color:var(--muted);font-size:13px}


html.theme-fade,html.theme-fade body{overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;transition:background .4s ease,color .35s ease,background-color .4s ease}
html.theme-fade .glass,html.theme-fade .btn,html.theme-fade .tabs,html.theme-fade .pill,html.theme-fade .srch,html.theme-fade .field,html.theme-fade .opt,html.theme-fade .wr,html.theme-fade .tp,html.theme-fade .md{
  transition:background .55s ease,border-color .5s ease,color .45s ease,box-shadow .5s ease,transform .35s ease !important;
}

.welcome{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(165deg,var(--bg1),var(--bg2));animation:win .45s ease both}
@keyframes win{from{opacity:0}to{opacity:1}}
.welcome-card{max-width:400px;width:100%;text-align:center;padding:28px 22px 24px;border-radius:28px}
.welcome-card h1{font:800 22px var(--h);margin:12px 0 10px;line-height:1.25}
.welcome-card p{color:var(--muted);font-weight:600;font-size:14.5px;line-height:1.55;margin:0 0 12px;text-align:left}
.welcome-card .w-list{text-align:left;margin:8px 0 18px;padding:0;list-style:none}
.welcome-card .w-list li{position:relative;padding:8px 0 8px 28px;font-weight:650;font-size:14px;color:var(--text)}
.welcome-card .w-list li::before{content:"";position:absolute;left:0;top:12px;width:16px;height:16px;border-radius:50%;
  background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 2px 6px rgba(120,110,220,.3)}
.welcome.out{animation:wout .4s ease both}
@keyframes wout{to{opacity:0;transform:scale(.97)}}


/* Achievements */
.ach-grid{display:flex;flex-direction:column;gap:10px;margin:8px 0 16px;width:100%}
.ach-card{
  display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;
  border-radius:22px;width:100%;box-sizing:border-box;
  transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s;
}
.ach-card.locked{opacity:.72}
.ach-card.ok{opacity:1}
.ach-card.legend{box-shadow:inset 0 0 0 1.5px rgba(212,175,55,.55),0 8px 24px rgba(180,140,40,.15)}
.ach-ico{
  width:44px;height:44px;min-width:44px;border-radius:14px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,var(--g1),var(--g2));
  border:1px solid var(--gb);
  box-shadow:inset 0 1px 0 var(--hi),0 4px 12px rgba(80,60,140,.1);
}
.ach-card.ok .ach-ico{
  background:linear-gradient(145deg,rgba(123,163,255,.35),rgba(183,148,246,.35));
}
.ach-card.legend .ach-ico{
  background:linear-gradient(145deg,rgba(212,175,55,.35),rgba(240,200,80,.2));
}
.ach-ico svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ach-card.ok .ach-ico svg{stroke:var(--a)}
.ach-card.legend .ach-ico svg{stroke:#c9a227}
.ach-body{overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;flex:1;min-width:0;text-align:left}
.ach-body b{display:block;font-size:14.5px;font-weight:800;line-height:1.25;margin:0 0 3px}
.ach-body span{display:block;font-size:12px;font-weight:600;color:var(--muted);line-height:1.35}
.ach-status{
  width:28px;height:28px;min-width:28px;border-radius:50%;
  display:grid;place-items:center;flex-shrink:0;
  background:rgba(120,110,180,.1);color:var(--muted);
}
.ach-card.ok .ach-status{background:rgba(47,158,107,.18);color:var(--ok)}
.ach-status svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ach-sum{text-align:center;font-weight:700;font-size:13px;color:var(--muted);margin:4px 0 12px}


.hint-box{margin:0 0 14px;padding:10px 14px;border-radius:14px;font-size:12.5px;font-weight:600;line-height:1.4;color:var(--muted);text-align:left;background:rgba(120,110,180,.08);border:1px solid var(--gb)}
.pron-card{padding:20px 16px;margin:12px 0;text-align:center}
.pron-card .word{margin:8px 0 6px}
.pron-card .trans{color:var(--muted);font-weight:600;font-size:14px;margin-bottom:12px}
.pron-big{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:18px;margin:0 0 14px;width:100%;box-sizing:border-box;text-align:left;cursor:pointer;border-radius:24px;border:0;color:var(--text);font:inherit;background:linear-gradient(135deg,rgba(123,163,255,.22),rgba(183,148,246,.16));box-shadow:inset 0 1px 0 var(--hi),0 8px 24px rgba(80,60,140,.12);transition:transform .3s}
.pron-big:active{transform:scale(.98)}
.pron-big b{font-size:16px;font-weight:800}
.pron-big small{color:var(--muted);font-weight:600;font-size:12.5px;line-height:1.35}
.pron-status{min-height:22px;font-size:13px;font-weight:700;color:var(--muted);margin:8px 0}
.pron-status.ok{color:var(--ok)}.pron-status.bad{color:var(--bad)}

.set-row{display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:14px 16px;margin-bottom:8px;text-align:left}
.set-row b{font-size:14px;font-weight:800}
.set-opts{display:flex;flex-wrap:wrap;gap:8px}
.set-opts button{flex:1;min-width:72px;border:1px solid var(--gb);border-radius:14px;padding:10px 12px;font:700 13px var(--f);color:var(--muted);cursor:pointer;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:inset 0 1px 0 var(--hi);transition:transform .25s,background .25s,color .25s,box-shadow .25s}
.set-opts button.on{color:#fff;background:linear-gradient(135deg,var(--a),var(--b));border-color:transparent;box-shadow:0 4px 14px rgba(120,110,220,.35)}
.set-opts button:active{transform:scale(.97)}
.set-hint{margin:0 0 12px;padding:0 4px;font-size:12px;font-weight:600;color:var(--muted);text-align:left;line-height:1.35}
.pill.fire{color:#e85d2a;gap:5px}
.pill.fire .flame{display:inline-block;animation:flicker 1.1s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg);filter:drop-shadow(0 0 2px rgba(255,120,40,.5))}50%{transform:scale(1.12) rotate(3deg);filter:drop-shadow(0 0 6px rgba(255,100,30,.7))}}
.pron-big{position:relative;overflow:hidden;border:1px solid rgba(123,163,255,.28)!important;transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s!important}
.pron-big::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:24px 0 0 24px;background:linear-gradient(180deg,var(--a),var(--b))}
.pron-big:hover{transform:translateY(-2px)}
.goal .goal-meta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.goal .goal-chip{padding:6px 12px;border-radius:12px;font:700 12px var(--f);background:rgba(120,110,180,.1);color:var(--muted)}
.goal.done .goal-chip.ok{background:rgba(47,158,107,.15);color:var(--ok)}
.mini{height:7px!important;border-radius:7px;background:rgba(120,110,180,.2)!important;overflow:hidden}
.mini i{background:linear-gradient(90deg,var(--a),var(--b))!important;transition:width 1s cubic-bezier(.22,1,.36,1)!important}

#cv,canvas#cv{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;pointer-events:none!important;z-index:0!important;display:block}
.tabs,.tabs button,.btn,.opt,.tp,.md,.pill,.play,.x,.wr,.chip,.set-opts button,.pron-big,.daily-card{pointer-events:auto!important;cursor:pointer}
#app{pointer-events:auto!important;position:relative;z-index:2}
.fb{pointer-events:none}
.fb.show{pointer-events:auto}
/* click-fix */
#app button,#app .tp,#app .md,#app .wr,#app .opt,#app .daily-card,#app .pron-big,#app .chip,#app .pill{position:relative;z-index:3;pointer-events:auto!important}
#tb{z-index:50!important;pointer-events:auto!important}
body>*{pointer-events:auto}
#cv{pointer-events:none!important}

/* Full hitboxes */
.btn,.opt,.tp,.md,.daily-card,.pron-big,.wr,.chip,.set-opts button{
  min-height:48px;touch-action:manipulation;-webkit-user-select:none;user-select:none;
}
.btn{width:100%;box-sizing:border-box}
.row .btn{flex:1;min-width:0}
.tabs button{min-height:52px;width:100%;justify-content:center}
.opt{width:100%;box-sizing:border-box;min-height:52px;display:flex;align-items:center;justify-content:center}
.pill{min-height:40px;min-width:40px}
/* Smoother entrances */
to{opacity:1;transform:none}
to{opacity:1;transform:none}
@keyframes slideup{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

#app .btn{animation:softpop .45s cubic-bezier(.22,1,.36,1) both}
/* Notifications panel */
.hd-actions{display:flex;gap:8px;align-items:center}
.pill.bell{position:relative}
.pill.bell .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#ff5c7a;box-shadow:0 0 0 2px var(--bg1);display:none}
.pill.bell.has-new .dot{display:block}
.notif-panel{
  position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));
  max-width:480px;margin:0 auto;z-index:80;max-height:70vh;overflow:auto;
  padding:16px;border-radius:24px;text-align:left;
  transform:translateY(-12px) scale(.98);opacity:0;pointer-events:none;
  transition:transform .35s cubic-bezier(.22,1,.36,1),opacity .3s;
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
}
.notif-panel.open{transform:none;opacity:1;pointer-events:auto}
.notif-panel h3{margin:0 0 12px;font:800 16px var(--f)}
.notif-item{padding:12px 0;border-bottom:1px solid var(--gb)}
.notif-item:last-child{border-bottom:0}
.notif-item b{display:block;font-size:13.5px;margin-bottom:4px}
.notif-item span{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.4}
.notif-ver{display:inline-block;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:800;
  background:linear-gradient(135deg,var(--a),var(--b));color:#fff!important;margin-right:6px;letter-spacing:.3px}
.card-ans{margin:10px 0;padding:12px 14px;border-radius:16px;font-weight:700;font-size:15px;
  background:rgba(47,158,107,.12);color:var(--ok);display:none}
.card-ans.show{display:block}
.notif-backdrop{position:fixed;inset:0;z-index:70;background:rgba(20,18,40,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.notif-backdrop.open{opacity:1;pointer-events:auto}


/* Pill hover (theme + notif) */
.pill{transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s,background .3s}
.pill:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 6px 16px rgba(80,60,140,.18)}
.pill:active{transform:scale(.92)}
.pill.bell:hover{color:var(--a)}
#th:hover{filter:brightness(1.08)}
/* Stronger flame */
.pill.fire .flame{animation:flicker 0.9s ease-in-out infinite}
@keyframes flicker{
 0%,100%{transform:scale(1) rotate(-4deg);filter:drop-shadow(0 0 3px rgba(255,100,30,.7))}
 25%{transform:scale(1.15) rotate(5deg);filter:drop-shadow(0 0 8px rgba(255,80,20,.9))}
 50%{transform:scale(1.08) rotate(-2deg);filter:drop-shadow(0 0 5px rgba(255,140,40,.8))}
 75%{transform:scale(1.18) rotate(4deg);filter:drop-shadow(0 0 10px rgba(255,90,20,.95))}
}
/* Podium rank outlines */
.pod .rank-1{box-shadow:inset 0 0 0 2.5px #f5c542,0 8px 24px rgba(245,197,66,.25)!important}
.pod .rank-2{box-shadow:inset 0 0 0 2.5px #c0c8d4,0 8px 24px rgba(160,170,190,.22)!important}
.pod .rank-3{box-shadow:inset 0 0 0 2.5px #d4956a,0 8px 24px rgba(200,130,80,.22)!important}
.pod .rank-1 .n{color:#c9a227}
.pod .rank-2 .n{color:#8a93a3}

.lr.rank-1{box-shadow:inset 0 0 0 2px #f5c542}
.lr.rank-2{box-shadow:inset 0 0 0 2px #c0c8d4}
.lr.rank-3{box-shadow:inset 0 0 0 2px #d4956a}
/* Brand logo with mini Lini */
.brand{display:inline-flex;align-items:center;justify-content:center;gap:1px;font:inherit}
.brand-lini{display:inline-block;width:1.15em;height:1.15em;vertical-align:-0.2em;margin:0 1px}
.brand-lini svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 4px rgba(80,60,140,.2))}
/* Notif panel polish */
.notif-backdrop{background:rgba(18,16,32,.4);-webkit-backdrop-filter:blur(0px);backdrop-filter:blur(0px);transition:opacity .35s ease,backdrop-filter .4s ease,-webkit-backdrop-filter .4s ease}
.notif-backdrop.open{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.notif-panel{padding:18px 16px 16px;max-width:400px;border-radius:22px;box-shadow:0 20px 50px rgba(40,30,80,.25)}
.notif-panel h3{font-size:15px;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.notif-item{padding:10px 0}
.notif-item b{font-size:12.5px}
.notif-item span{font-size:12px;line-height:1.45}
.notif-ver{font-size:10px;padding:2px 7px}
/* Tabs smoother */
.tabs{transition:transform .5s cubic-bezier(.33,1,.22,1),opacity .45s ease!important}


body.fs-s{font-size:14px}
body.fs-s .word{font-size:26px!important}
body.fs-s .btn{font-size:14px;padding:13px}
body.fs-s .opt{font-size:15px;padding:14px}
body.fs-s h1{font-size:20px}
body.fs-m{font-size:16px}
body.fs-l{font-size:18px}
body.fs-l .word{font-size:36px!important}
body.fs-l .btn{font-size:17px;padding:18px}
body.fs-l .opt{font-size:18px;padding:18px}
body.fs-l h1{font-size:26px}
body.fs-l .lab{font-size:13px}
/* Challenge card hover anim */
.md{transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s!important}
.md:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 14px 32px rgba(80,60,140,.18)!important}
.md:active{transform:scale(.97)}
.pron-big{transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s!important}
.pron-big:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(100,90,200,.2)!important}

.heat{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;padding:12px;margin:8px 0}
.heat i{aspect-ratio:1;border-radius:3px;background:rgba(120,110,180,.08)}
.heat i.l1{background:rgba(123,163,255,.25)}.heat i.l2{background:rgba(123,163,255,.45)}
.heat i.l3{background:rgba(123,163,255,.65)}.heat i.l4{background:rgba(90,120,255,.9)}
.weak-list{text-align:left;margin:8px 0}
.weak-row{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px;border-radius:14px}
.weak-row b{flex:1;font-size:14px}.weak-row small{color:var(--muted);font-weight:700}
.cefr-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;font:800 13px var(--f);
  background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.ctx-box{margin:10px 0;padding:12px 14px;border-radius:14px;font:600 14px var(--f);text-align:left;
  background:rgba(123,163,255,.1);border:1px solid rgba(123,163,255,.2);line-height:1.4}
.season-chip{display:inline-block;padding:4px 10px;border-radius:10px;font:700 12px var(--f);
  background:rgba(120,110,180,.12);color:var(--muted);margin:4px}



/* Heatmap rich tooltip */
.heat{position:relative}
.heat i{cursor:default;transition:transform .15s,box-shadow .15s}
.heat i:hover{transform:scale(1.35);z-index:2;box-shadow:0 0 0 1px rgba(120,110,180,.35)}
.htip{
  position:fixed;z-index:200;pointer-events:none;
  min-width:160px;max-width:220px;padding:10px 12px;border-radius:12px;
  background:var(--g2);color:var(--text);border:1px solid var(--gb);
  box-shadow:0 10px 28px rgba(30,20,60,.28);
  font:600 12px var(--f);line-height:1.45;text-align:left;
  opacity:0;transform:translateY(4px);transition:opacity .18s,transform .18s;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.htip.show{opacity:1;transform:none}
.htip b{display:block;font-size:12.5px;margin-bottom:4px}
.htip span{display:block;color:var(--muted);font-weight:600;font-size:11.5px}
/* Dark theme notif version */
[data-theme="dark"] .notif-ver{
  background:linear-gradient(135deg,#6b8cff,#9b7aef)!important;
  color:#fff!important;box-shadow:0 2px 8px rgba(0,0,0,.35);
}
[data-theme="dark"] .notif-panel{background:rgba(28,26,42,.96)!important}
[data-theme="dark"] .notif-item span{color:rgba(220,218,235,.85)!important}
[data-theme="dark"] .notif-backdrop{background:rgba(8,6,18,.55)}
/* Softer theme transition — no glare */
html.theme-fade .glass::before,
html.theme-fade .btn::after{opacity:0!important;animation:none!important}
html.theme-fade .md,html.theme-fade .pron-big,html.theme-fade .tp,html.theme-fade .daily-card{
  transition:background .4s ease,border-color .4s ease,color .35s ease,box-shadow .4s ease!important;
  transform:none!important;
}
/* Challenge cards: keep hover without collision glare */
.md{position:relative;overflow:hidden}
.md::after{display:none!important}
.md:hover{
  transform:translateY(-3px)!important;
  box-shadow:0 10px 24px rgba(80,60,140,.14)!important;
  filter:none!important;
}
[data-theme="dark"] .md:hover{
  box-shadow:0 10px 28px rgba(0,0,0,.35)!important;
  background:linear-gradient(135deg,rgba(50,48,72,.95),rgba(40,38,60,.95))!important;
}
.pron-big:hover{filter:none!important}
[data-theme="dark"] .btn::after{opacity:.15}


/* Force hide tabs when feedback open or scrolling */
.tabs.force-hide{transform:translate3d(-50%,140%,0)!important;opacity:0!important;pointer-events:none!important}
.fb.show{bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60}
body.fb-open .tabs{transform:translate3d(-50%,140%,0)!important;opacity:0!important;pointer-events:none!important}
/* Smoother, calmer animations — no glare */

var T=[],PH=[],ALL=[];
function loadWords(){
 if(!WORDS_DATA||!WORDS_DATA.topics)return;
 T=WORDS_DATA.topics;PH=WORDS_DATA.phrases||[];
 var P2=['#8ec5ff,#a9a1ff','#ffb3d1,#d1a3ff','#ffc58f,#ff9db8','#9fe3c8,#8ec5ff','#c3a8ff,#ff9fcb','#8ee0d0,#a3b8ff'];
 var seen={};
 function dedupe(list){
  return (list||[]).filter(function(w){
   if(!w||!w[0])return false;
   var k=String(w[0]).toLowerCase();
   if(seen[k])return false;
   seen[k]=1;return true;
  });
 }
 T.forEach(function(tp,i){tp.w=dedupe(tp.w);if(!tp.c)tp.c=P2[i%6].split(',')});
 PH.forEach(function(tp,i){tp.w=dedupe(tp.w);if(!tp.c)tp.c=P2[(i+2)%6].split(',')});
 ALL=T.reduce(function(a,tp){return a.concat(tp.w||[])},[]);
}
loadWords();

 try{

}
function markErr(en,ok){
 if(!en)return;
 en=String(en);
 S.err=S.err||{};S.w=S.w||{};
 if(ok){
  S.w[en]=(S.w[en]|0)+1;
  if(S.w[en]>=2&&S.err[en])S.err[en]=Math.max(0,(S.err[en]|0)-1);
  if(S.w[en]>=3)srsPop(en);
 }else{
  S.w[en]=Math.max(0,(S.w[en]|0)-1);
  S.err[en]=(S.err[en]|0)+1;
  srsPush(en);
 }
 save();
}
function srsPush(en){
 S.srs=S.srs||[];
 if(S.srs.indexOf(en)<0)S.srs.unshift(en);
 if(S.srs.length>80)S.srs=S.srs.slice(0,80);
}
function srsPop(en){
 S.srs=(S.srs||[]).filter(function(x){return x!==en});
}
function weakWords(n){
 n=n||20;
 S.err=S.err||{};
 var keys=Object.keys(S.err).filter(function(k){return S.err[k]>0});
 keys.sort(function(a,b){return (S.err[b]||0)-(S.err[a]||0)});
 return keys.slice(0,n).map(function(e){
  var ru='';
  for(var i=0;i<(ALL||[]).length;i++){if(ALL[i][0]===e){ru=ALL[i][1];break}}
  return {e:e,r:ru,n:S.err[e]||0,k:S.w[e]||0};
 });
}
function findPair(en){
 for(var i=0;i<(ALL||[]).length;i++)if(ALL[i][0]===en)return ALL[i];
 return [en,en];
}
function weightedPool(base,n){
 base=base&&base.length?base.slice():(ALL||[]).slice();
 if(!base.length)return [];
 var weak=weakWords(15).map(function(x){return x.e});
 var srs=S.srs||[];
 var out=[], used={};
 function add(p){if(!p||used[p[0]])return;used[p[0]]=1;out.push(p)}
 // priority: srs then weak then random
 srs.forEach(function(e){if(out.length<n)add(findPair(e))});
 weak.forEach(function(e){if(out.length<n)add(findPair(e))});
 var rest=sh(base);
 for(var i=0;i<rest.length&&out.length<n;i++)add(rest[i]);
 return out;
}

function cefrDistractors(correct,n){
 n=n||3;
 var pool=[];
 (ALL||[]).forEach(function(w){if(w[1]&&w[1]!==correct)pool.push(w[1])});
 var fb=['архитектура','уязвимость','масштабируемость','аутентификация','развёртывание','инфраструктура','производительность','требование','ограничение','эвристика','парадигма','компромисс','избыточность','согласованность','оркестрация'];
 fb.forEach(function(x){if(x!==correct)pool.push(x)});
 // prefer similar length distractors
 pool=sh(pool.filter(function(x,i,a){return a.indexOf(x)===i&&x!==correct}));
 pool.sort(function(a,b){return Math.abs(a.length-correct.length)-Math.abs(b.length-correct.length)});
 return pool.slice(0,n);
}

function randDir(){return Math.random()<.5?0:1}
function genKeys(isPhrase,n,diff){
 var base;
 if(isPhrase){
  if(diff==='hard') base=['build','type','build','listen','build','type','build','listen','build','type','build','listen'];
  else if(diff==='easy') base=['pick','build','pick','listen','build','pick'];
  else base=['build','pick','build','listen','build','pick','build','listen','build','pick'];
 }else if(diff==='easy'){
  base=['pick','pick','listen','pick','pick','listen','pick'];
 }else if(diff==='hard'){
  base=['type','pick','listen','type','pick','type','listen','type','pick','type','listen','type','pick','type'];
 }else{
  base=['pick','listen','pick','type','pick','pick','listen','pick','type','pick'];
 }
 while(base.length<n)base=base.concat(base);
 base=base.slice(0,n);
 return base.map(function(k){
  if(k==='pick'){
   if(diff==='hard')return 'pick1';
   if(diff==='easy')return 'pick0';
   return 'pick'+randDir();
  }
  return k;
 });
}

function wordDiffScore(en){
 if(!en)return 0;
 var e=String(en).toLowerCase(), s=0;
 if(e.length>=10)s+=2;else if(e.length>=7)s+=1;
 if(e.indexOf(' ')>=0)s+=2;
 if(/tion|sion|ment|ous|ive|ize|ise|ph|gh|que/.test(e))s+=2;
 if(S.err&&S.err[en])s+=Math.min(3,S.err[en]);
 // known easy
 if(/^(the|a|an|is|are|to|and|or|in|on|at|my|you|he|she|it|we|they|yes|no|hi|ok)$/.test(e))s=0;
 return s;
}
function hardDistractors(correctPair, n, pool){
 n=n||3;
 pool=(pool&&pool.length?pool:ALL)||[];
 var target=wordDiffScore(correctPair[0]);
 var scored=pool.filter(function(w){return w[1]!==correctPair[1]&&w[0]!==correctPair[0]}).map(function(w){
  return {w:w,d:Math.abs(wordDiffScore(w[0])-target)};
 });
 scored.sort(function(a,b){return a.d-b.d||Math.random()-0.5});
 var out=[];
 for(var i=0;i<scored.length&&out.length<n;i++){
  var tr=scored[i].w[1];
  if(out.indexOf(tr)<0)out.push(tr);
 }
 while(out.length<n)out.push(['вариант','система','данные','уровень'][out.length%4]);
 return out;
}
function hardPairDistractors(correctPair,n,pool){

 });

 var out=[];

 }
 return out;
}

function drillWord(item){
 // Build a small pool around this word from same topic + the word itself
 var pool=[];
 var topics=T.concat(PH||[]);
 var tp=topics[item.t];
 if(tp&&tp.w){
  // include the word + up to 7 neighbors from same topic
  pool=sh(tp.w.slice()).slice(0,8);
  if(!pool.some(function(w){return w[0]===item.e})) pool.unshift([item.e,item.r]);
 }else{
  pool=[[item.e,item.r]];
  // pad with random known words so pick options work
  sh(ALL).slice(0,7).forEach(function(w){if(w[0]!==item.e)pool.push(w)});
 }
 if(pool.length<4){
  sh(ALL).forEach(function(w){if(pool.length<6&&!pool.some(function(x){return x[0]===w[0]}))pool.push(w)});
 }
 var modes=[
  S.lang==='en'?'Quick check':'Быстрая проверка',
  S.lang==='en'?'Focus drill':'Фокус-тренировка',
  S.lang==='en'?'Recall test':'Проверка памяти'
 ];
 startMini(pool, modes[Math.random()*modes.length|0]+' · '+item.e);
}

function qHtml(q){
 var h='';
 if(q.k=='pick'||q.k=='listen'){
  var ls=q.k=='listen',en=ls||q.d==0,ix=ls?0:(en?1:0);
  var nOpt=S.diff==='easy'?2:S.diff==='hard'?6:3;
  var targetD=wordDiffScore(q.w[0]);
  var candidates=(q.pool||ALL||[]).filter(function(x){return x!==q.w&&x[0]!==q.w[0]});
  candidates.sort(function(a,b){return Math.abs(wordDiffScore(a[0])-targetD)-Math.abs(wordDiffScore(b[0])-targetD)||Math.random()-0.5});
  // for hard mode prefer only hard-ish words
  if(S.diff==='hard'){candidates=candidates.filter(function(x){return wordDiffScore(x[0])>=Math.max(1,targetD-1)}).concat(candidates)}
  var picked=[],seen={};
  for(var ci=0;ci<candidates.length&&picked.length<nOpt;ci++){
   var c=candidates[ci];if(seen[c[0]])continue;seen[c[0]]=1;picked.push(c);
  }
  while(picked.length<nOpt&&candidates.length){picked.push(candidates[picked.length%candidates.length])}
  q.o=sh([q.w].concat(picked.slice(0,nOpt)));q.ix=ix;

   h+='<div class="lab">'+t('whatHeard')+'</div>';

function normalizeSpeech(s){
 return String(s||'').toLowerCase().replace(/[^\w\s']/g,' ').replace(/\s+/g,' ').trim();
}
function speechClose(a,b){
 a=normalizeSpeech(a);b=normalizeSpeech(b);
 if(!a||!b)return false;
 if(a===b)return true;
 if(a.indexOf(b)>=0||b.indexOf(a)>=0)return true;
 var ta=a.split(' '),tb=b.split(' '),hit=0;
 tb.forEach(function(t){if(t.length>1&&ta.indexOf(t)>=0)hit++});
 return hit>=Math.ceil(tb.length*0.6);
}

 // upgrade: ensure high difficulty
 words=hard.slice(0,12).map(function(w){return{kind:'word',w:w}});
 var phrases=[];
 (PH||[]).forEach(function(tp){(tp.w||[]).forEach(function(w){phrases.push({kind:'phrase',w:w})})});
 phrases=sh(phrases).sort(function(a,b){return wordDiffScore(b.w[0])-wordDiffScore(a.w[0])}).slice(0,5);
 return sh(words.slice(0,7).concat(phrases.slice(0,3)));
}

 var out=s;rules.forEach(function(r){out=out.replace(r[0],r[1])});
 return '/'+out+'/';
}

var cv=$('#cv'),cx=cv.getContext('2d'),Q=[],run=false,COL=['#7ba3ff','#b794f6','#ff9fc4','#7fe0b8','#ffcf7a'];
function rs(){if(!cv)return;cv.width=innerWidth;cv.height=innerHeight;cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0'}rs();addEventListener('resize',function(){rs();fitScroll()});
var _lastY=0,_scrollTicking=false,_tabsLocked=false;
function setTabsDown(hide){
 var el=document.getElementById('tb');
 if(!el)return;
 if(_tabsLocked){el.classList.add('hide');el.classList.remove('down');return}
 el.classList.toggle('down',!!hide);
}
function onScrollDir(){
 _scrollTicking=false;
 var y=window.pageYOffset||document.documentElement.scrollTop||document.body.scrollTop||0;
 var a=document.getElementById('app');
 if(a)y=Math.max(y,a.scrollTop||0);
 var dy=y-_lastY;
 if(y<16){setTabsDown(false)}
 else if(dy>2){setTabsDown(true)}
 else if(dy<-8){setTabsDown(false)}
 else if(y>80){setTabsDown(true)}
 _lastY=y;
}
function bindAppScroll(){
 if(window._lqScrollBound)return;
 window._lqScrollBound=1;
 function onScr(){
  if(_scrollTicking)return;
  _scrollTicking=true;
  requestAnimationFrame(onScrollDir);
 }
 window.addEventListener('scroll',onScr,{passive:true});
 window.addEventListener('touchmove',onScr,{passive:true});
 document.addEventListener('scroll',onScr,{passive:true,capture:true});
 var a=document.getElementById('app');
 if(a&&!a._scrollBound){a._scrollBound=1;a.addEventListener('scroll',onScr,{passive:true})}
}
bindAppScroll();


function burst(x,y,n){for(var i=0;i<n;i++)Q.push({x:x,y:y,vx:(Math.random()-.5)*11,vy:-Math.random()*13-3,c:COL[i%5],s:5+Math.random()*6,l:70+Math.random()*30});if(!run){run=true;requestAnimationFrame(tick)}}
function tick(){cx.clearRect(0,0,cv.width,cv.height);Q=Q.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.l--;cx.fillStyle=p.c;cx.globalAlpha=Math.max(p.l/40,0);cx.beginPath();cx.arc(p.x,p.y,p.s/2,0,6.3);cx.fill();return p.l>0});cx.globalAlpha=1;if(Q.length)requestAnimationFrame(tick);else run=false}
